<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTL Talent Curve | ระบบประเมินพฤติกรรมทีม · โรงพยาบาลซีทีแอล</title>
<meta name="description" content="ระบบประเมินพฤติกรรมพนักงานตามกราฟระฆังคว่ำ แผนพัฒนาบุคคล และแดชบอร์ดผู้บริหาร โรงพยาบาลซีทีแอล">
<meta name="theme-color" content="#1d1a3a">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="CTL Talent Curve · โรงพยาบาลซีทีแอล">
<meta property="og:description" content="ประเมินพฤติกรรมทีม · แผนพัฒนาบุคคล (IDP) · แดชบอร์ดผู้บริหาร">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23ffe800' stroke='%231d1a3a' stroke-width='2.5'/%3E%3Cpath d='M5 30 C12 30 13 9 20 9 C27 9 28 30 35 30' fill='none' stroke='%23ff48b0' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='9' r='3.4' fill='%231d1a3a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Anuphan:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#f3ede1;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f3ede1}
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background-color:#f3ede1;background-image:radial-gradient(rgba(29,26,58,.07) 1px,transparent 1.3px);background-size:7px 7px;
    font-family:'Anuphan',sans-serif;color:#1d1a3a;transition:opacity .4s}
  #splash.hide{opacity:0;pointer-events:none}
  #splash h1{font-family:'Mitr',sans-serif;font-weight:500;font-size:28px;margin:0;text-shadow:2px 2px 0 #ff48b0}
  #splash p{margin:0;color:#6b6785;font-size:14px}
  .bar{width:180px;height:10px;border:2.5px solid #1d1a3a;border-radius:99px;overflow:hidden;background:#fff}
  .bar i{display:block;height:100%;width:40%;background:#ff48b0;animation:mv 1.1s infinite ease-in-out}
  @keyframes mv{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #fallback{display:none;margin-top:6px}
  #fallback a{font-family:'Mitr',sans-serif;color:#1d1a3a;background:#ffe800;border:2.5px solid #1d1a3a;border-radius:14px;padding:9px 16px;text-decoration:none;box-shadow:3px 3px 0 #1d1a3a}
</style>
</head>
<body>
<div id="splash">
  <svg width="76" height="76" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#ffe800" stroke="#1d1a3a" stroke-width="2.5"/><path d="M5 30 C12 30 13 9 20 9 C27 9 28 30 35 30" fill="none" stroke="#ff48b0" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="9" r="3.4" fill="#1d1a3a"/></svg>
  <h1>CTL Talent Curve</h1>
  <p>ระบบประเมินพฤติกรรมทีม · โรงพยาบาลซีทีแอล</p>
  <div class="bar"><i></i></div>
  <div id="fallback"><a id="openNew" target="_blank" rel="noopener">เปิดระบบในหน้าต่างใหม่</a></div>
</div>
<iframe id="app" title="CTL Talent Curve" allow="fullscreen; clipboard-write; downloads" allowfullscreen></iframe>
<script>
  // ใส่ URL ของ Web app (ลงท้าย /exec) ที่นี่ เมื่อ Deploy ใหม่แล้ว URL เปลี่ยน ให้แก้บรรทัดนี้บรรทัดเดียว
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwOQlC58v7ZP8NGoAZt6oh6Oz_Xc450JKbPhGJifrKoCK71HRHaGM8brFe78ldkrU6WHg/exec';
  const f = document.getElementById('app'), sp = document.getElementById('splash');
  document.getElementById('openNew').href = APP_URL;
  f.addEventListener('load', () => setTimeout(() => sp.classList.add('hide'), 600));
  f.src = APP_URL;
  setTimeout(() => { if (!sp.classList.contains('hide')) document.getElementById('fallback').style.display = 'block'; }, 9000);
</script>
</body>
</html>
